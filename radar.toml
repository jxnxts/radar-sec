# Radar SEC settings. The values below are the defaults; edit freely.
# Point to another file with --config or the RADAR_CONFIG variable.

lang = "en"                     # language for AI summaries, alerts and CLI output: "en" or "pt-BR" (env RADAR_LANG overrides)

[signals]
cluster_window_days = 14        # window (days) in which the purchases must happen
cluster_min_insiders = 2        # distinct insiders needed to form a cluster_buy
cluster_min_value = 100000.0    # minimum total of the cluster's purchases (US$)
officer_min_value = 250000.0    # minimum CEO/CFO purchase for big_officer_buy (US$)
activist_min_percent = 5.0      # minimum stake in a new 13D for activist_13d (%)
cooldown_days = 30              # days before the same signal repeats for the same issuer
exclude_funds = true            # drop closed-end funds and similar vehicles from cluster_buy/big_officer_buy
fund_sic_codes = ["6722", "6726"]  # SIC codes treated as funds (6798, REITs, is not one)
fund_name_heuristic = true      # without a SIC, also drop obvious fund names ("Municipal Income Fund")

[sec]
requests_per_second = 8.0       # the SEC limit is 10 per second
max_retries = 5                 # retries on 429/5xx, with growing waits
timeout_seconds = 30.0
# "SCHEDULE 13D" is the form's current name and covers amendments. The old name,
# "SC 13D", has received no filings since Dec 2024: its feed is empty and slow.
feed_forms = ["4", "SCHEDULE 13D"]
feed_count = 100                # entries per page of the Form 4 feed
feed_count_13d = 40             # smaller page for 13D: the SEC answers much faster
feed_max_pages = 5              # maximum pages read per cycle
backfill_issuer = true          # fetch the issuer's recent Form 4s when a P purchase shows up

[ai]
enabled = true                  # false = always use the template summary
model = "haiku"                 # model used to summarize signals
timeout_seconds = 90.0
max_calls_per_hour = 30         # call ceiling, so the subscription quota is not used up

[dashboard]
# Avoid-type signals (late filings, crowded shorts, CEO/CFO exits...) are hidden by
# default for companies below either threshold or of unknown liquidity ("Show small caps").
avoid_min_price = 5.0                   # latest price (US$)
avoid_min_market_value = 300000000.0    # price × shares outstanding (US$)

[backtest]
cost_roundtrip = 0.002          # round-trip cost deducted from each trade (0.2%)
horizons_months = [1, 3, 6]
benchmark = "SPY"
extra_benchmarks = ["IWM"]
min_price = 5.0                 # liquidity filter: minimum purchase price (US$)
min_market_cap = 300000000.0    # liquidity filter: minimum market cap (US$)
price_tolerance_days = 5        # trading days of slack to find the entry/exit price
price_check_min_ratio = 0.5     # market price ÷ Form 4 price: accepted range
price_check_max_ratio = 2.0
price_jump_ratio = 5.0          # daily jump that signals a reverse split Yahoo did not adjust...
price_jump_below = 1.0          # ...when it starts from a price below this value (US$)
price_batch_size = 20           # tickers per Yahoo query
price_requests_per_second = 2.0 # average pace; bigger bursts get blocked by Yahoo

[sources]
# Extra sources polled by `radar watch` and `radar serve`, each at its own pace:
# form144 and eightk every cycle, thirteenf every 15 min, short (FINRA/SEC files) hourly,
# news per the [news] section below.
enabled = ["form144", "eightk", "thirteenf", "short", "news"]

[news]
# Free news inputs. Items that name a listed company (explicit "(NYSE: XYZ)" tickers
# first, then exact company names from the SEC registry) show on the dashboard tape.
interval_seconds = 300.0        # press-release wires (PR Newswire keeps only its latest 20 items)
# "businesswire" is off: its robots.txt disallows /rss/ for generic agents (the client checks
# robots.txt and refuses it). "globenewswire" answers 403 to automated clients.
wires = ["prnewswire"]
gdelt = false                   # GDELT DOC 2.0; off: it answered 429 to every request when tested
gdelt_interval_seconds = 900.0
gdelt_query = "(NYSE OR NASDAQ) sourcelang:english"
gdelt_max_records = 250
tiingo_interval_seconds = 900.0 # Tiingo News runs only when TIINGO_API_KEY is set (.env)
min_host_interval_seconds = 5.0 # politeness: at most one request per host every 5 s
user_agent = "radar-sec/0.1 (news reader)"
timeout_seconds = 30.0
context_days = 30               # days of news in the dashboard's company context

[forward]
# Append-only forward-test log: data/forward/YYYY-MM-DD.jsonl.gz, one record per signal,
# market event and news item, with the UTC time the radar saw it. `radar forward-summary`
# counts what was recorded.
enabled = true
price_snapshot = true           # once a day, the closes needed to evaluate the signals later
snapshot_after_utc_hour = 21    # first cycle after this UTC hour (after the US close), weekdays
price_signal_days = 200         # tickers with a signal in this many days get a daily close...
price_event_days = 30           # ...and tickers with a market event (8-K, news...) in these days
price_max_symbols = 3000
