name: Data quality
description: A filing was parsed wrong, a signal fired when it should not, or a ticker, price or sector is off.
labels: [data-quality]
body:
  - type: input
    id: accession
    attributes:
      label: Accession number or filing URL
      placeholder: 0001831686-26-000014
    validations:
      required: true
  - type: input
    id: signal
    attributes:
      label: Signal type (if any)
      placeholder: cluster_buy
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: What radar-sec shows and what the original document says.
    validations:
      required: true
