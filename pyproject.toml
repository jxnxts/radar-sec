[project]
name = "radar-sec"
version = "0.1.0"
description = "radar-sec: monitors EDGAR filings, detects insider buying signals and measures them with a backtest."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.184",
    "defusedxml>=0.7",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "yfinance>=1.0",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
